name: Bug Report
description: Report a defect with clear steps and evidence.
title: ""
labels:
  - bug
body:
  - type: input
    id: summary
    attributes:
      label: Summary
      description: Short, specific description of the bug.
      placeholder: "Example: CI linux-smoke fails on migrations"
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: Describe the observed behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe what should have happened.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide numbered steps to reproduce.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence / Logs
      description: Include logs, error output, or links. For CI failures, attach tests/.tmp logs if available.
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - local
        - CI linux-smoke
        - CI windows-smoke
        - other
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional screenshots or recordings.
    validations:
      required: false
  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Optional context, links, or related issues.
    validations:
      required: false
