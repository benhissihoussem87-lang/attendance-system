openapi: 3.1.0
info:
  title: Attendance System API
  version: 0.1.0
  description: |
    Multi-tenant API scoped by `company_id`.
    When authentication is enabled, tenant is derived from credentials (for example API key context).
    Request-scoped `company_id` parameters are primarily for development/testing and non-auth deployments.
servers:
  - url: http://localhost:3000
tags:
  - name: ops
  - name: device-events
  - name: device-registry
  - name: agent-admin
  - name: agent-bridge
  - name: identity-mappings
  - name: employees-registry
  - name: attendance
  - name: companies
  - name: company-profile
  - name: employee-assignments
  - name: employees
  - name: policy-profiles
  - name: resolutions
  - name: rule-sets
  - name: simulation
  - name: system
paths:
  /api/ops/health:
    get:
      tags: [ops]
      operationId: getOpsHealth
      responses:
        "200":
          description: Health check
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - system_version
                  - uptime_seconds
                properties:
                  status:
                    type: string
                  system_version:
                    type: string
                  uptime_seconds:
                    type: integer
  /api/ops/ready:
    get:
      tags: [ops]
      operationId: getOpsReady
      responses:
        "200":
          description: Ready check
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - db
                  - system_version
                properties:
                  status:
                    type: string
                  db:
                    type: string
                  system_version:
                    type: string
  /api/ops/test/mode:
    get:
      tags: [ops]
      operationId: getOpsTestMode
      responses:
        "200":
          description: Mode snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModeResponse"
        "404":
          description: Not found (test endpoints disabled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/device-events/import/preview:
    post:
      tags: [device-events]
      operationId: previewDeviceEventsCsv
      description: |
        Previews CSV ingestion using vendor-specific parsing.
        `x-vendor` (or `vendor`) selects device/vendor format only; it does not determine tenant.
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/company_id"
        - in: query
          name: vendor
          schema:
            type: string
        - in: header
          name: x-vendor
          schema:
            type: string
        - in: query
          name: delimiter
          schema:
            type: string
        - in: header
          name: x-csv-delimiter
          schema:
            type: string
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
      responses:
        "200":
          description: Preview response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                validation_error:
                  summary: Missing/invalid company_id
                  value:
                    error: bad_request
                    code: VALIDATION_ERROR
                    message: Validation failed
                    details:
                      kind: validation
                      error: invalid_request
                      detail: company_id is required
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/devices:
    get:
      tags: [device-registry]
      operationId: listDevices
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/company_id"
        - $ref: "#/components/parameters/x-company-id"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - in: query
          name: provider
          schema:
            type: string
        - in: query
          name: device_uid
          schema:
            type: string
        - in: query
          name: site_id
          schema:
            type: string
            format: uuid
        - in: query
          name: managed_status
          schema:
            type: string
            enum: [candidate, managed, inactive, unreachable]
        - in: query
          name: manageability_status
          schema:
            type: string
            enum: [unknown, reachable, protocol_reachable, blocked, manageable, ingesting]
        - in: query
          name: remediation_manual_status
          schema:
            type: string
            enum: [needs_field_action, clear, none, "null"]
        - $ref: "#/components/parameters/lifecycle_scope"
      responses:
        "200":
          description: Devices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicesListResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/devices/{device_uid}:
    get:
      tags: [device-registry]
      operationId: getDevice
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/device_uid"
        - $ref: "#/components/parameters/company_id"
        - $ref: "#/components/parameters/x-company-id"
      responses:
        "200":
          description: Device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                validation_error:
                  summary: Missing/invalid company_id
                  value:
                    error: bad_request
                    code: VALIDATION_ERROR
                    message: Validation failed
                    details:
                      kind: validation
                      error: invalid_request
                      detail: company_id is required
        "404":
          description: Device not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                lookup_not_found:
                  summary: Device not found
                  value:
                    error: not_found
                    code: LOOKUP_NOT_FOUND
                    message: Device not found
                    details:
                      kind: lookup_error
                      error: device_not_found
    put:
      tags: [device-registry]
      operationId: upsertDevice
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/device_uid"
        - $ref: "#/components/parameters/company_id"
        - $ref: "#/components/parameters/x-company-id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceUpsertRequest"
      responses:
        "200":
          description: Upserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                validation_error:
                  summary: Missing/invalid company_id
                  value:
                    error: bad_request
                    code: VALIDATION_ERROR
                    message: Validation failed
                    details:
                      kind: validation
                      error: invalid_request
                      detail: company_id is required
                company_id_not_found:
                  summary: company_id not found
                  value:
                    error: bad_request
                    code: VALIDATION_ERROR
                    message: Validation failed
                    details:
                      kind: validation
                      error: company_id_not_found
                      detail: company_id not found
  /api/agent-admin/provisioning-tokens:
    post:
      tags: [agent-admin]
      operationId: createAgentProvisioningToken
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentProvisioningTokenCreateRequest"
      responses:
        "201":
          description: Provisioning token created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProvisioningToken"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/agent-admin/agents/{agent_id}/commands/scan-subnet:
    post:
      tags: [agent-admin]
      operationId: queueScanSubnetCommand
      security:
        - ApiKeyAuth: []
      parameters:
        - name: agent_id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/company_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanSubnetCommandRequest"
      responses:
        "201":
          description: Command queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentCommand"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/agent-admin/agents/{agent_id}/commands/pull-device-events:
    post:
      tags: [agent-admin]
      operationId: queuePullDeviceEventsCommand
      security:
        - ApiKeyAuth: []
      parameters:
        - name: agent_id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/company_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PullDeviceEventsCommandRequest"
      responses:
        "201":
          description: Command queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentCommand"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Agent/device not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Pull command conflict (in-flight, lifecycle-binding, or execution-gate block)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                in_flight:
                  summary: Existing in-flight pull command
                  value:
                    error: bad_request
                    code: CONFLICT
                    message: Conflict
                    details:
                      kind: conflict
                      error: command_already_in_flight
                binding_missing:
                  summary: Managed device has no active managing-agent binding
                  value:
                    error: bad_request
                    code: CONFLICT
                    message: Conflict
                    details:
                      kind: conflict
                      error: device_managing_agent_binding_missing
                binding_conflict:
                  summary: Queue requested from agent that is not actively bound
                  value:
                    error: bad_request
                    code: CONFLICT
                    message: Conflict
                    details:
                      kind: conflict
                      error: device_managing_agent_binding_conflict
                execution_gate_site_context_missing_for_pull:
                  summary: Pull issuance blocked because device has no formal site context under strict policy
                  value:
                    error: bad_request
                    code: CONFLICT
                    message: Conflict
                    details:
                      kind: conflict
                      error: site_context_missing_for_pull
                      execution_gate:
                        policy_profile: strict
                        gate_mode: issuance
                superseded_without_canonical:
                  summary: Superseded device uid without canonical redirect target
                  value:
                    error: bad_request
                    code: CONFLICT
                    message: Conflict
                    details:
                      kind: conflict
                      error: device_uid_superseded_without_canonical
                execution_gate_lease_mismatch:
                  summary: Target agent is not the active site runtime
                  value:
                    error: bad_request
                    code: CONFLICT
                    message: Conflict
                    details:
                      kind: conflict
                      error: site_active_runtime_mismatch
                      execution_gate:
                        site_id: "11111111-1111-1111-1111-111111111111"
                        active_site_agent_id: "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa"
                        target_agent_id: "bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb"
                execution_gate_active_runtime_missing:
                  summary: Site has no active runtime lease and command is policy-blocked
                  value:
                    error: bad_request
                    code: CONFLICT
                    message: Conflict
                    details:
                      kind: conflict
                      error: site_active_runtime_missing
                      execution_gate:
                        site_id: "11111111-1111-1111-1111-111111111111"
                        policy_profile: balanced
                execution_gate_stale_reported_state:
                  summary: Site runtime reported state is stale
                  value:
                    error: bad_request
                    code: CONFLICT
                    message: Conflict
                    details:
                      kind: conflict
                      error: runtime_reported_state_stale
                      execution_gate:
                        site_id: "11111111-1111-1111-1111-111111111111"
                        runtime_reported_stale: true
                execution_gate_missing_reported_state:
                  summary: Site runtime reported state is missing and command is policy-blocked
                  value:
                    error: bad_request
                    code: CONFLICT
                    message: Conflict
                    details:
                      kind: conflict
                      error: runtime_reported_state_missing
                      execution_gate:
                        runtime_health_status: unknown
                        runtime_health_reason: site_runtime_reported_state_missing
                execution_gate_version_unsupported:
                  summary: Agent runtime version is below supported policy
                  value:
                    error: bad_request
                    code: CONFLICT
                    message: Conflict
                    details:
                      kind: conflict
                      error: runtime_version_unsupported
                      execution_gate:
                        version_support_status: unsupported
                        version_support_reason: below_minimum_supported
                execution_gate_runtime_capability_unknown:
                  summary: Pull command capability evidence is unknown and policy blocks issuance
                  value:
                    error: bad_request
                    code: CONFLICT
                    message: Conflict
                    details:
                      kind: conflict
                      error: runtime_capability_unknown
                      execution_gate:
                        required_runtime_capability_key: command.pull_device_events
                        runtime_capability_status: unknown
                        policy_profile: balanced
                execution_gate_runtime_capability_unsupported:
                  summary: Runtime is healthy but pull command capability is unsupported
                  value:
                    error: bad_request
                    code: CONFLICT
                    message: Conflict
                    details:
                      kind: conflict
                      error: runtime_capability_unsupported
                      execution_gate:
                        required_runtime_capability_key: command.pull_device_events
                        runtime_capability_status: unsupported
                        runtime_capability_reason: runtime_missing_driver
  /api/agent-admin/commands:
    get:
      tags: [agent-admin]
      operationId: listAgentCommands
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/company_id"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - in: query
          name: agent_id
          schema:
            type: string
        - in: query
          name: device_uid
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [queued, sent, acknowledged, failed, expired]
        - in: query
          name: created_from
          schema:
            type: string
            format: date-time
        - in: query
          name: created_to
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Agent command lifecycle list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentCommandsListResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/agent-admin/agents:
    get:
      tags: [agent-admin]
      operationId: listAgentNodes
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/company_id"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - in: query
          name: status
          schema:
            type: string
            enum: [active, inactive, revoked]
        - in: query
          name: seen_since
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Agent operational list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentNodesListResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/agent-admin/version-policy:
    get:
      tags: [agent-admin]
      operationId: getAgentVersionPolicy
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/company_id"
      responses:
        "200":
          description: Effective agent version governance policy for company scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentVersionPolicyReadResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    put:
      tags: [agent-admin]
      operationId: updateAgentVersionPolicy
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/company_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentVersionPolicyUpdateRequest"
      responses:
        "200":
          description: Company policy override updated and effective policy recomputed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentVersionPolicyReadResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/agent-admin/agents/{agent_id}/runtime-identity:
    get:
      tags: [agent-admin]
      operationId: getAgentRuntimeIdentity
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/company_id"
        - in: path
          name: agent_id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: history_limit
          schema:
            type: integer
            minimum: 1
            maximum: 20
      responses:
        "200":
          description: Agent runtime identity state and bounded history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRuntimeIdentityReadResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/agent-admin/agents/{agent_id}/runtime-identity/reissue:
    post:
      tags: [agent-admin]
      operationId: reissueAgentRuntimeIdentity
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/company_id"
        - in: path
          name: agent_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRuntimeIdentityReissueRequest"
      responses:
        "201":
          description: Runtime identity reissued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRuntimeIdentityReissueResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Agent cannot be reissued in current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/agent-admin/agents/{agent_id}/runtime-identity/revoke:
    post:
      tags: [agent-admin]
      operationId: revokeAgentRuntimeIdentity
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/company_id"
        - in: path
          name: agent_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRuntimeIdentityRevokeRequest"
      responses:
        "200":
          description: Runtime identity revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRuntimeIdentityRevokeResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Runtime identity conflict (already inactive)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/agent-admin/agents/{agent_id}/site:
    put:
      tags: [agent-admin]
      operationId: setAgentSiteAssignment
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/company_id"
        - in: path
          name: agent_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentSiteAssignmentRequest"
      responses:
        "200":
          description: Agent site assignment updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSiteAssignmentResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Agent or site not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/agent-admin/sites:
    get:
      tags: [agent-admin]
      operationId: listSites
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/company_id"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - in: query
          name: status
          schema:
            type: string
            enum: [active, inactive]
      responses:
        "200":
          description: Sites list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteListResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      tags: [agent-admin]
      operationId: createSite
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/company_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteCreateRequest"
      responses:
        "201":
          description: Site created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteRecord"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: site_key conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/agent-admin/sites/{site_id}:
    get:
      tags: [agent-admin]
      operationId: getSite
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/company_id"
        - $ref: "#/components/parameters/site_id"
      responses:
        "200":
          description: Site record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteRecord"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Site not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      tags: [agent-admin]
      operationId: updateSite
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/company_id"
        - $ref: "#/components/parameters/site_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteUpdateRequest"
      responses:
        "200":
          description: Site updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteRecord"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Site not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/agent-admin/sites/{site_id}/active-agent:
    get:
      tags: [agent-admin]
      operationId: getSiteActiveAgent
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/company_id"
        - $ref: "#/components/parameters/site_id"
      responses:
