components:
  parameters:
    company_id:
      name: company_id
      in: query
      schema:
        type: string
        default: DEFAULT
    x-company-id:
      name: x-company-id
      in: header
      schema:
        type: string
    limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 200
    offset:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
        minimum: 0
    active_query:
      name: active
      in: query
      schema:
        type: string
        enum:
          - "true"
          - "false"
    device_uid:
      name: device_uid
      in: path
      required: true
      schema:
        type: string
  schemas:
    ModeResponse:
      type: object
      required:
        - allow_test_endpoints
        - use_identity_mappings
        - require_identity_mappings
        - identity_mapping_policy
        - use_employees_registry
        - use_employee_assignments
      properties:
        allow_test_endpoints:
          type: boolean
        use_identity_mappings:
          type: boolean
        require_identity_mappings:
          type: boolean
        identity_mapping_policy:
          type: string
        use_employees_registry:
          type: boolean
        use_employee_assignments:
          type: boolean
    PreviewResponse:
      type: object
      required:
        - system_version
        - contract
        - import_version
        - total_rows
        - valid_rows
        - invalid_rows
        - errors
        - sample_valid_rows
        - sample_rows
      properties:
        system_version:
          type: string
        contract:
          type: string
        import_version:
          type: string
        total_rows:
          type: integer
        valid_rows:
          type: integer
        invalid_rows:
          type: integer
        errors:
          type: array
          items:
            $ref: "#/components/schemas/PreviewError"
        sample_valid_rows:
          type: array
          items:
            $ref: "#/components/schemas/PreviewSampleRow"
        sample_rows:
          type: array
          items:
            $ref: "#/components/schemas/PreviewSampleRow"
        sample_invalid_rows:
          type: array
          items:
            $ref: "#/components/schemas/PreviewSampleRow"
        error_intelligence:
          type: object
    DeviceEventsCommitResponse:
      type: object
      required:
        - system_version
        - contract
        - import_version
        - total_rows
        - valid_rows
        - invalid_rows
        - inserted_rows
        - skipped_rows
        - failed_rows
        - errors
        - inserted_samples
      properties:
        system_version:
          type: string
        contract:
          type: string
        import_version:
          type: string
        total_rows:
          type: integer
        valid_rows:
          type: integer
        invalid_rows:
          type: integer
        inserted_rows:
          type: integer
        skipped_rows:
          type: integer
        failed_rows:
          type: integer
        errors:
          type: array
          items:
            $ref: "#/components/schemas/PreviewError"
        inserted_samples:
          $ref: "#/components/schemas/DeviceEventsCommitInsertedSamples"
    DeviceEventsCommitInsertedSamples:
      type: object
      required:
        - first3
        - last3
      properties:
        first3:
          type: array
          items:
            $ref: "#/components/schemas/DeviceEventsCommitInsertedSample"
        last3:
          type: array
          items:
            $ref: "#/components/schemas/DeviceEventsCommitInsertedSample"
    DeviceEventsCommitInsertedSample:
      type: object
      required:
        - row_number
        - person_id
        - event_time_utc
        - direction
        - device_uid
        - vendor
      properties:
        row_number:
          type: integer
        person_id:
          type: string
        event_time_utc:
          type: string
        direction:
          type: string
        device_uid:
          type: string
        vendor:
          type: string
    PreviewError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        row_number:
          type: integer
    PreviewSampleRow:
      type: object
      required:
        - row_number
        - data
      properties:
        row_number:
          type: integer
        data:
          type: object
          properties:
            resolved_person_id:
              type: string
            identity_mapping_applied:
              type: boolean
            identity_mapping_reason:
              type: string
            vendor:
              type: string
            provider:
              type: string
            device_uid:
              type: string
    DeviceUpsertRequest:
      type: object
      properties:
        provider:
          type: string
        device_name:
          type: string
        active:
          type: boolean
        metadata:
          type: object
    Device:
      type: object
      properties:
        company_id:
          type: string
        device_uid:
          type: string
        provider:
          type: string
        device_name:
          type: string
        active:
          type: boolean
        metadata:
          type: object
        created_at:
          type: string
        updated_at:
          type: string
    DevicesListResponse:
      type: object
      required:
        - value
        - Count
      properties:
        value:
          type: array
          items:
            $ref: "#/components/schemas/Device"
        Count:
          type: integer
    IdentityMappingUpsertRequest:
      type: object
      required:
        - provider
        - identifier_type
        - identifier_value
        - person_id
      properties:
        provider:
          type: string
        identifier_type:
          type: string
        identifier_value:
          type: string
        person_id:
          type: string
        active:
          type: boolean
        metadata:
          type: object
    IdentityMapping:
