components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    AgentBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
  parameters:
    company_id:
      name: company_id
      in: query
      description: |
        Tenant scoping. In production, prefer auth-derived tenant.
        Query param is primarily for dev/testing and non-auth deployments.
        CSV row values are not authoritative for tenant scoping.
      schema:
        type: string
        default: DEFAULT
    x-company-id:
      name: x-company-id
      in: header
      schema:
        type: string
    limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 200
    offset:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
        minimum: 0
    lifecycle_scope:
      name: lifecycle_scope
      in: query
      schema:
        type: string
        enum: [bridge_ops, ingest_only]
    active_query:
      name: active
      in: query
      schema:
        type: string
        enum:
          - "true"
          - "false"
    device_uid:
      name: device_uid
      in: path
      required: true
      schema:
        type: string
    site_id:
      name: site_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    ModeResponse:
      type: object
      required:
        - allow_test_endpoints
        - use_identity_mappings
        - require_identity_mappings
        - identity_mapping_policy
        - use_employees_registry
        - use_employee_assignments
      properties:
        allow_test_endpoints:
          type: boolean
        use_identity_mappings:
          type: boolean
        require_identity_mappings:
          type: boolean
        identity_mapping_policy:
          type: string
        use_employees_registry:
          type: boolean
        use_employee_assignments:
          type: boolean
    PreviewResponse:
      type: object
      required:
        - system_version
        - contract
        - import_version
        - total_rows
        - valid_rows
        - invalid_rows
        - errors
        - sample_valid_rows
        - sample_rows
      properties:
        system_version:
          type: string
        contract:
          type: string
        import_version:
          type: string
        total_rows:
          type: integer
        valid_rows:
          type: integer
        invalid_rows:
          type: integer
        errors:
          type: array
          items:
            $ref: "#/components/schemas/PreviewError"
        sample_valid_rows:
          type: array
          items:
            $ref: "#/components/schemas/PreviewSampleRow"
        sample_rows:
          type: array
          items:
            $ref: "#/components/schemas/PreviewSampleRow"
        sample_invalid_rows:
          type: array
          items:
            $ref: "#/components/schemas/PreviewSampleRow"
        error_intelligence:
          type: object
    DeviceEventsCommitResponse:
      type: object
      required:
        - system_version
        - contract
        - import_version
        - total_rows
        - valid_rows
        - invalid_rows
        - inserted_rows
        - skipped_rows
        - failed_rows
        - errors
        - inserted_samples
      properties:
        system_version:
          type: string
        contract:
          type: string
        import_version:
          type: string
        total_rows:
          type: integer
        valid_rows:
          type: integer
        invalid_rows:
          type: integer
        inserted_rows:
          type: integer
        skipped_rows:
          type: integer
        failed_rows:
