    post:
      tags: [agent-admin]
      operationId: queueManualDeviceValidation
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/device_uid"
        - $ref: "#/components/parameters/company_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualDeviceValidationRequest"
      responses:
        "202":
          description: Validation command queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualDeviceValidationResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Device or agent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Lifecycle conflict (non-candidate, non-bridge scope, in-flight validation, superseded uid without canonical, or execution-gate block)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                validation_in_flight:
                  summary: Existing in-flight validation command
                  value:
                    error: bad_request
                    code: CONFLICT
                    message: Conflict
                    details:
                      kind: conflict
                      error: validation_command_already_in_flight
                execution_gate_offline:
                  summary: Active runtime reported offline
                  value:
                    error: bad_request
                    code: CONFLICT
                    message: Conflict
                    details:
                      kind: conflict
                      error: runtime_health_offline
                      execution_gate:
                        runtime_health_status: offline
                        runtime_health_reason: heartbeat_missing
                execution_gate_version_unknown:
                  summary: Runtime version is unknown/stale (policy-dependent block)
                  value:
                    error: bad_request
                    code: CONFLICT
                    message: Conflict
                    details:
                      kind: conflict
                      error: runtime_version_unknown
                      execution_gate:
                        version_support_status: unknown
                        policy_profile: strict
                execution_gate_version_outdated_blocked:
                  summary: Runtime version is outdated and blocked by strict policy
                  value:
                    error: bad_request
                    code: CONFLICT
                    message: Conflict
                    details:
                      kind: conflict
                      error: runtime_version_outdated
                      execution_gate:
                        version_support_status: outdated
                        policy_profile: strict
                execution_gate_device_path_capability_disabled:
                  summary: Device path capability is disabled by policy/config
                  value:
                    error: bad_request
                    code: CONFLICT
                    message: Conflict
                    details:
                      kind: conflict
                      error: device_path_capability_disabled
                      execution_gate:
                        required_device_capability_key: device_path.validate_device_candidate
                        device_path_capability_status: disabled
                        device_path_capability_reason: policy_disabled
